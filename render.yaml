# Owner: R1. Task C-12: Render Blueprint for the Surplus demo.
#
# Two services: the Express API (REST + SSE + webhooks) and the Next.js web app.
# SQLite lives on the ephemeral filesystem and is reseeded on every boot; live
# webhook rows do not survive a restart (see docs/decisions.md, C-12). The live
# demo is a fresh sandbox payment, so this is acceptable and avoids a paid disk.
#
# Secrets use `sync: false`: Render prompts for them in the dashboard and never
# stores them in this repository.
services:
  - type: web
    name: surplus-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @surplus/api build
    startCommand: pnpm --filter @surplus/api start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: ./surplus.db
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_RESET_TOKEN
        sync: false
      - key: WEB_ORIGIN
        sync: false

  - type: web
    name: surplus-web
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @surplus/web build
    startCommand: pnpm --filter @surplus/web start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set after the API is live, e.g. https://surplus-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
